services:
  - type: web
    name: oracle-to-databricks-migration
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: ENVIRONMENT
        value: PROD
      - key: DATABASE_URL
        value: sqlite:////tmp/migration_factory.db
      - key: JWT_SECRET
        generateValue: true
      - key: BOOTSTRAP_ADMIN_USERNAME
        value: admin
      - key: BOOTSTRAP_ADMIN_PASSWORD
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: SOURCE_TYPE
        value: ORACLE
      - key: ORACLE_HOST
        sync: false
      - key: ORACLE_PORT
        value: "1521"
      - key: ORACLE_SERVICE_NAME
        sync: false
      - key: ORACLE_SID
        sync: false
      - key: ORACLE_SCHEMA
        sync: false
      - key: ORACLE_USERNAME
        sync: false
      - key: ORACLE_PASSWORD
        sync: false
      - key: ORACLE_MODE
        value: THIN
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        value: "3306"
      - key: MYSQL_DATABASE
        sync: false
      - key: MYSQL_USERNAME
        value: root
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_SSL_MODE
        value: DISABLED
      - key: POSTGRES_HOST
        sync: false
      - key: POSTGRES_PORT
        value: "5432"
      - key: POSTGRES_DATABASE
        sync: false
      - key: POSTGRES_USERNAME
        sync: false
      - key: POSTGRES_PASSWORD
        sync: false
      - key: POSTGRES_SCHEMA
        value: public
      - key: POSTGRES_SSLMODE
        value: prefer
      - key: SQLSERVER_DRIVER
        value: ODBC Driver 18 for SQL Server
      - key: SQLSERVER_HOST
        sync: false
      - key: SQLSERVER_DATABASE
        sync: false
      - key: SQLSERVER_USERNAME
        sync: false
      - key: SQLSERVER_PASSWORD
        sync: false
      - key: DATABRICKS_HOST
        sync: false
      - key: DATABRICKS_HTTP_PATH
        sync: false
      - key: DATABRICKS_TOKEN
        sync: false
      - key: DEV_CATALOG
        value: migration_dev
      - key: TEST_CATALOG
        value: migration_test
      - key: UAT_CATALOG
        value: migration_uat
      - key: PROD_CATALOG
        value: migration_prod
      - key: CONTROL_CATALOG
        value: migration_control
      - key: CONTROL_SCHEMA
        value: migration_control
      - key: LLM_ENABLED
        value: "true"
      - key: LLM_PROVIDER
        value: GEMINI
      - key: LLM_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gemini-3.6-flash
      - key: DEPLOYMENT_POLICY
        value: FAIL_ON_SCHEMA_DRIFT
      - key: DEV_SCHEMA_POLICY
        value: REPLACE_CHANGED
      - key: BATCH_SIZE
        value: "10000"
      - key: PARALLELISM
        value: "4"
      - key: LOAD_MODE
        value: FULL_LOAD
